# Default test settings. Any value can be overridden on the command line,
# e.g.  mvn test -Dheadless=true -Dbase.url=https://staging.example.com/

base.url=https://www.saucedemo.com/

# Public SauceDemo demo account (published on the login page, not a real secret)
username=standard_user
password=secret_sauce

# chrome or firefox
browser=chrome
headless=false
timeout.seconds=10

# Selenium Grid address. Empty = start the browser on this machine.
# To use the Docker Grid:  docker compose up -d   then   mvn test -Dgrid.url=http://localhost:4444
grid.url=

# API tests: Restful-Booker, a public practice API (its admin login is published in its docs, not a real secret)
api.base.url=https://restful-booker.herokuapp.com
api.username=admin
api.password=password123
