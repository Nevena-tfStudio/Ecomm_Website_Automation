name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a run by hand from the Actions tab

jobs:
  test:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Firefox failure shouldn't cancel the Chrome run, and vice versa
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # matches maven.compiler.release in pom.xml
          cache: maven

      # The Allure plugin downloads Node.js and the Allure report tool into .allure/
      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Chrome and Firefox are preinstalled on ubuntu-latest; Selenium Manager gets the drivers.
      - name: Run tests (headless ${{ matrix.browser }})
        run: mvn -B test -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Build Allure report
        if: always() # build it for failed runs too: that's when it's most useful
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore # screenshots only exist when something failed
