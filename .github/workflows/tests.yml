name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a run by hand from the Actions tab
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC: catches changes on the live site even when nobody pushes

jobs:
  test:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Firefox failure shouldn't cancel the Chrome run, and vice versa
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # matches maven.compiler.release in pom.xml
          cache: maven

      # The Allure plugin downloads Node.js and the Allure report tool into .allure/
      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Chrome and Firefox are preinstalled on ubuntu-latest; Selenium Manager gets the drivers.
      - name: Run tests (headless ${{ matrix.browser }})
        run: mvn -B test -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Build Allure report
        if: always() # build it for failed runs too: that's when it's most useful
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore # screenshots only exist when something failed

  # Nightly (and manual) only: re-check the documented site bugs. These tests are expected to fail
  # while the bugs exist, so the job is allowed to fail without turning the run red. Its report shows
  # which bugs are still there; a test that starts passing means a bug was fixed.
  known-defects:
    name: Known defects (chrome)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Run known-defect tests
        run: mvn -B test -Dheadless=true -Dbrowser=chrome -DsuiteXml=src/test/resources/known-defects.xml

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-defects-report
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore
