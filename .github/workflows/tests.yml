name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a run by hand from the Actions tab
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC: catches changes on the live site even when nobody pushes

jobs:
  test:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a Firefox failure shouldn't cancel the Chrome run, and vice versa
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # matches maven.compiler.release in pom.xml
          cache: maven

      # The Allure plugin downloads Node.js and the Allure report tool into .allure/
      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Chrome and Firefox are preinstalled on ubuntu-latest; Selenium Manager gets the drivers.
      - name: Run tests (headless ${{ matrix.browser }})
        run: mvn -B test -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Build Allure report
        if: always() # build it for failed runs too: that's when it's most useful
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore # screenshots only exist when something failed

  # Re-checks the documented site bugs (not on pull requests). These tests are expected to fail
  # while the bugs exist, so the job is allowed to fail without turning the run red. Its report shows
  # which bugs are still there; a test that starts passing means a bug was fixed.
  known-defects:
    name: Known defects (chrome)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Run known-defect tests
        run: mvn -B test -Dheadless=true -Dbrowser=chrome -DsuiteXml=src/test/resources/known-defects.xml

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-defects-report
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # API tests against Restful-Booker. No browser needed, so they run in their own fast job.
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Run API tests
        run: mvn -B test -DsuiteXml=src/test/resources/api.xml

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  # Documented API bugs. Like the UI known defects: expected to fail, never turns the run red.
  api-known-defects:
    name: API known defects
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Allure tooling
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Run API known-defect tests
        run: mvn -B test -DsuiteXml=src/test/resources/api-known-defects.xml

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-known-defects-report
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  # Publishes the Allure reports to GitHub Pages, so anyone can open them in the browser.
  publish-reports:
    name: Publish reports to GitHub Pages
    needs: [test, known-defects, api, api-known-defects]
    # Publish after failed runs too (that's when the report matters most), but only for main.
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Build site
        env:
          RESULT: ${{ needs.test.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          mkdir -p site
          for name in chrome:test-reports-chrome firefox:test-reports-firefox known-defects:known-defects-report api:api-report api-known-defects:api-known-defects-report; do
            dir="${name%%:*}"; artifact="${name#*:}"
            report="reports/$artifact/site/allure-maven-plugin/index.html"
            if [ -f "$report" ]; then mkdir -p "site/$dir" && cp "$report" "site/$dir/index.html"; fi
          done
          date="$(date -u '+%Y-%m-%d %H:%M UTC')"
          short_sha="${GITHUB_SHA::7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Test reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; color: #1f2328; background: #fff; }
              a { color: #0969da; }
              li { margin: .6rem 0; }
              .meta { color: #59636e; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>Test reports</h1>
            <h2>UI (SauceDemo)</h2>
            <p>Allure reports from the latest CI run of
              <a href="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY">$GITHUB_REPOSITORY</a>.</p>
            <ul>
              <li><a href="chrome/">Regression suite on Chrome</a></li>
              <li><a href="firefox/">Regression suite on Firefox</a></li>
              <li><a href="known-defects/">Known defects</a>: tests for real site bugs, expected to fail until the site is fixed</li>
            </ul>
            <h2>API (Restful-Booker)</h2>
            <ul>
              <li><a href="api/">API tests</a></li>
              <li><a href="api-known-defects/">API known defects</a>: tests for real API bugs, expected to fail until the API is fixed</li>
            </ul>
            <p class="meta">UI regression: $RESULT &middot; API: $API_RESULT &middot; commit <code>$short_sha</code> &middot; $date &middot;
              <a href="$run_url">CI run</a></p>
          </body>
          </html>
          HTML

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
