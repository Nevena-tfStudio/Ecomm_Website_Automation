name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a run by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25' # matches maven.compiler.release in pom.xml
          cache: maven

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager downloads the matching driver.
      - name: Run tests (headless Chrome)
        run: mvn -B test -Dheadless=true

      - name: Upload test reports
        if: always() # keep the reports for failed runs too
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14
